name: Build spec

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: |
          docker pull ghcr.io/${{ github.repository }} || true
          docker build --cache-from ghcr.io/${{ github.repository }} \
            -t ghcr.io/${{ github.repository }} .

      - name: Build
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/${{ github.repository }} make

      - uses: docker/login-action@v4
        if: ${{ !env.ACT }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: ${{ !env.ACT }}
        run: docker push ghcr.io/${{ github.repository }}

      - name: Publish to GitHub Pages
        if: ${{ !env.ACT }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
